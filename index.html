<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quick Marketplace</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a href="index.html" class="brand">⚡ Quick Marketplace</a>
  <a href="admin.html" class="top-link">Admin</a>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Shop from local stores</h1>
    <p>Find products, add them to your cart and order for delivery.</p>
    <input id="searchInput" placeholder="Search for products...">
  </section>

  <div id="categoryBar" class="chips"></div>

  <section id="productsSection">
    <div class="section-head">
      <h2>Products</h2>
      <button id="viewAllBtn" class="link-btn">View all</button>
    </div>
    <div id="products" class="grid"></div>
    <div id="empty" class="empty hidden">No products found.</div>
  </section>

  <section class="info-grid">
    <div class="info"><b>⚡ Quick Delivery</b><span>Available for eligible local orders.</span></div>
    <div class="info"><b>🚚 Delivery</b><span>Local and inter-city delivery.</span></div>
  </section>
</main>

<nav class="bottom">
  <a class="active" href="index.html">🏠<span>Home</span></a>
  <a href="index.html#productsSection">🛍️<span>Products</span></a>
  <a href="shop.html">🏪<span>Shop</span></a>
  <a href="cart.html">🛒<span>Cart</span><em id="cartCount">0</em></a>
  <a href="profile.html">👤<span>Profile</span></a>
</nav>

<div id="productModal" class="modal hidden">
  <div class="modal-box">
    <button class="close" id="closeProduct">×</button>
    <div id="productDetails"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
