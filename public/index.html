<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Quick Marketplace</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body>

  <!-- HEADER -->
  <header class="top">
    <div>
      <h1>Quick Marketplace</h1>
      <p>Buy • Sell • Deliver</p>
    </div>

    <a href="auth.html" class="account">
      Account
    </a>
  </header>


  <main class="wrap">

    <!-- SEARCH -->
    <section class="hero">
      <h2>What do you need?</h2>

      <input
        id="search"
        type="search"
        placeholder="Search products or shops..."
      >
    </section>


    <!-- CATEGORIES -->
    <section>

      <div class="section-head">
        <h2>Categories</h2>

        <a href="products.html">
          View all
        </a>
      </div>

      <div id="categories" class="categories"></div>

    </section>


    <!-- PRODUCTS -->
    <section>

      <div class="section-head">
        <h2>Products</h2>

        <a href="products.html">
          View all
        </a>
      </div>

      <div id="products" class="grid"></div>

    </section>


    <!-- DELIVERY -->
    <section class="delivery-grid">

      <a href="delivery.html" class="feature">
        <b>⚡ Quick Delivery</b>

        <span>
          Fast local delivery for eligible orders.
        </span>
      </a>


      <a href="delivery.html" class="feature">
        <b>🚚 Anywhere in Nigeria</b>

        <span>
          Delivery routes across Nigeria.
        </span>
      </a>

    </section>

  </main>


  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom">

    <a href="index.html" class="active">
      🏠
      <span>Home</span>
    </a>


    <a href="products.html">
      🛍️
      <span>Products</span>
    </a>


    <a href="shop.html">
      🏪
      <span>Shop</span>
    </a>


    <a href="cart.html">
      🛒
      <span>
        Cart
        <i id="cartCount">0</i>
      </span>
    </a>


    <a href="profile.html">
      👤
      <span>Profile</span>
    </a>

  </nav>


  <!-- JAVASCRIPT -->
  <script src="common.js"></script>
  <script src="app.js"></script>

</body>
</html>
