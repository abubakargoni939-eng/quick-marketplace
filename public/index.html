<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Marketplace</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 15px;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      background: #111;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .result {
      background: #f0f0f0;
      padding: 15px;
      border-radius: 8px;
      display: none;
      line-height: 1.7;
    }

    .success {
      color: green;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>Quick Marketplace</h1>
    <p>Your marketplace app is ready.</p>
  </header>

  <div class="container">

    <!-- CREATE SHOP -->
    <div class="card">
      <h2>Create Your Shop</h2>

      <label>Shop Owner Name</label>
      <input
        type="text"
        id="ownerName"
        placeholder="Enter your name"
      >

      <label>Shop Name</label>
      <input
        type="text"
        id="shopName"
        placeholder="Enter shop name"
      >

      <label>Shop Location</label>
      <input
        type="text"
        id="shopLocation"
        placeholder="e.g. "
      >

      <label>Commission per Item (₦)</label>
      <input
        type="number"
        id="commission"
        placeholder="e.g. "
        min="1"
      >

      <button onclick="createShop()">Create Shop</button>

      <div id="shopResult" class="result"></div>
    </div>


    <!-- ADD PRODUCT -->
    <div class="card">
      <h2>Add Product</h2>

      <label>Product Name</label>
      <input
        type="text"
        id="productName"
        placeholder="e.g. "
      >

      <label>Price (₦)</label>
      <input
        type="number"
        id="productPrice"
        placeholder="e.g. (₦)"
        min="1"
      >

      <label>Minimum Quantity</label>
      <input
        type="number"
        id="minimumQuantity"
        placeholder="e.g. "
        min="1"
      >

      <button onclick="addProduct()">Add Product</button>

      <div id="productResult" class="result"></div>
    </div>


    <!-- CUSTOMER REQUEST -->
    <div class="card">
      <h2>Customer Request 🛒</h2>

      <label>What do you want?</label>
      <input
        type="text"
        id="requestProduct"
        placeholder="e.g. Rice, Shoes, Phone..."
      >

      <label>Quantity</label>
      <input
        type="number"
        id="requestQuantity"
        placeholder="e.g. "
        min="1"
      >

      <label>Note (Optional)</label>
      <input
        type="text"
        id="requestNote"
        placeholder="Any extra information..."
      >

      <button onclick="sendRequest()">Send Request</button>

      <div id="requestResult" class="result"></div>
    </div>


    <!-- DELIVERY -->
    <div class="card">
      <h2>Delivery</h2>

      <label>From</label>
      <input
        type="text"
        id="fromLocation"
        placeholder="e.g. "
      >

      <label>To</label>
      <input
        type="text"
        id="toLocation"
        placeholder="e.g. "
      >

      <label>Order Amount (₦)</label>
      <input
        type="number"
        id="orderAmount"
        placeholder="e.g. (₦)"
        min="1"
      >

      <label>Delivery Fee (₦)</label>
      <input
        type="number"
        id="deliveryFee"
        placeholder="e.g. (₦)"
        min="1"
      >

      <button onclick="calculateDelivery()">
        Calculate Delivery
      </button>

      <div id="deliveryResult" class="result"></div>
    </div>

  </div>


  <script>

    // CREATE SHOP
    function createShop() {

      const ownerName =
        document.getElementById("ownerName").value.trim();

      const shopName =
        document.getElementById("shopName").value.trim();

      const shopLocation =
        document.getElementById("shopLocation").value.trim();

      const commission =
        Number(document.getElementById("commission").value);

      if (
        !ownerName ||
        !shopName ||
        !shopLocation ||
        commission <= 0
      ) {
        alert("Please fill in all shop details correctly.");
        return;
      }

      const shop = {
        ownerName: ownerName,
        shopName: shopName,
        location: shopLocation,
        commission: commission
      };

      localStorage.setItem(
        "quickMarketplaceShop",
        JSON.stringify(shop)
      );

      const result =
        document.getElementById("shopResult");

      result.style.display = "block";

      result.innerHTML =
        '<span class="success">Shop created successfully!</span><br><br>' +
        "Owner: " + ownerName + "<br>" +
        "Shop: " + shopName + "<br>" +
        "Location: " + shopLocation + "<br>" +
        "Commission: ₦" +
        commission.toLocaleString() +
        " per item.";
    }


    // ADD PRODUCT
    function addProduct() {

      const name =
        document.getElementById("productName").value.trim();

      const price =
        Number(document.getElementById("productPrice").value);

      const minimum =
        Number(document.getElementById("minimumQuantity").value);

      if (
        !name ||
        price <= 0 ||
        minimum <= 0
      ) {
        alert("Please fill in all product details correctly.");
        return;
      }

      const product = {
        name: name,
        price: price,
        minimumQuantity: minimum
      };

      localStorage.setItem(
        "quickMarketplaceProduct",
        JSON.stringify(product)
      );

      const result =
        document.getElementById("productResult");

      result.style.display = "block";

      result.innerHTML =
        '<span class="success">Product added successfully!</span><br><br>' +
        "Product: " + name + "<br>" +
        "Price: ₦" +
        price.toLocaleString() + "<br>" +
        "Minimum quantity: " +
        minimum;
    }


    // CUSTOMER REQUEST
    function sendRequest() {

      const product =
        document.getElementById("requestProduct").value.trim();

      const quantity =
        Number(
          document.getElementById("requestQuantity").value
        );

      const note =
        document.getElementById("requestNote").value.trim();

      if (!product || quantity <= 0) {
        alert("Please enter the product name and quantity.");
        return;
      }

      const savedProduct =
        JSON.parse(
          localStorage.getItem("quickMarketplaceProduct")
        );

      const shop =
        JSON.parse(
          localStorage.getItem("quickMarketplaceShop")
        );

      const result =
        document.getElementById("requestResult");

      result.style.display = "block";


      // IF PRODUCT EXISTS
      if (
        savedProduct &&
        savedProduct.name.toLowerCase() ===
        product.toLowerCase()
      ) {

        if (quantity < savedProduct.minimumQuantity) {

          result.innerHTML =
            "Minimum quantity for this product is " +
            savedProduct.minimumQuantity +
            ".";

          return;
        }

        const total =
          savedProduct.price * quantity;

        const commission =
          shop ? shop.commission * quantity : 0;

        const shopOwnerAmount =
          total - commission;

        result.innerHTML =
          '<span class="success">Product found!</span><br><br>' +
          "Product: " + savedProduct.name + "<br>" +
          "Quantity: " + quantity + "<br>" +
          "Price per item: ₦" +
          savedProduct.price.toLocaleString() + "<br>" +
          "Total: ₦" +
          total.toLocaleString() + "<br>" +
          "Commission: ₦" +
          commission.toLocaleString() + "<br>" +
          "Shop Owner Receives: ₦" +
          shopOwnerAmount.toLocaleString();

        return;
      }


      // IF PRODUCT DOES NOT EXIST
      const request = {
        product: product,
        quantity: quantity,
        note: note,
        date: new Date().toLocaleString(),
        status: "Pending"
      };

      let requests =
        JSON.parse(
          localStorage.getItem("quickMarketplaceRequests")
        ) || [];

      requests.push(request);

      localStorage.setItem(
        "quickMarketplaceRequests",
        JSON.stringify(requests)
      );

      result.innerHTML =
        '<span class="success">Request sent successfully!</span><br><br>' +
        "Product: " + product + "<br>" +
        "Quantity: " + quantity + "<br>" +
        "Note: " + (note || "None") + "<br><br>" +
        "The shop owner will review your request.";
    }


    // DELIVERY CALCULATOR
    function calculateDelivery() {

      const from =
        document.getElementById("fromLocation").value.trim();

      const to =
        document.getElementById("toLocation").value.trim();

      const orderAmount =
        Number(
          document.getElementById("orderAmount").value
        );

      const deliveryFee =
        Number(
          document.getElementById("deliveryFee").value
        );

      if (
        !from ||
        !to ||
        orderAmount <= 0 ||
        deliveryFee <= 0
      ) {
        alert("Please fill in all delivery details correctly.");
        return;
      }

      let appPayment = 0;
      let customerPayment = deliveryFee;


      // APP PAYS 50% FOR ORDERS ₦50,000+
      if (orderAmount >= ₦) {

        appPayment =
          deliveryFee * 0.5;

        customerPayment =
          deliveryFee * 0.5;
      }


      const result =
        document.getElementById("deliveryResult");

      result.style.display = "block";

      result.innerHTML =
        "<strong>Route:</strong> " +
        from + " → " + to + "<br>" +

        "<strong>Delivery Fee:</strong> ₦" +
        deliveryFee.toLocaleString() + "<br>" +

        "<strong>App Pays:</strong> ₦" +
        appPayment.toLocaleString() + "<br>" +

        "<strong>Customer Pays:</strong> ₦" +
        customerPayment.toLocaleString();
    }

  </script>

</body>
</html>
