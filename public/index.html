<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Marketplace</title><link rel="stylesheet" href="/style.css"></head><body><header><b>Quick Marketplace</b><nav><a href="#products">Products</a><a href="#orders">Orders</a><a href="#dashboard">Dashboard</a><a id="adminLink" class="hide" href="#admin">Admin</a></nav><span id="who">Guest</span><button id="login">Login</button><button id="logout" class="hide">Logout</button></header><main><section class="hero"><div><small>NIGERIA MARKETPLACE</small><h1>Buy, sell and deliver with Quick Marketplace.</h1><p>Real accounts, products, shops, orders and delivery records powered by Supabase.</p><button onclick="location.hash='products'">Shop now</button></div></section><section id="products"><h2>Products</h2><input id="search" placeholder="Search any product"><div id="productsGrid" class="grid"></div></section><section id="orders"><h2>My Orders</h2><div id="ordersList"></div></section><section id="dashboard"><h2>Dashboard</h2><div id="dash"></div></section><section id="admin"><h2>Admin</h2><div id="adminBox"></div></section></main><aside id="cart"><h2>Cart <button onclick="toggleCart()">×</button></h2><div id="cartItems"></div><b id="subtotal">₦0</b><input id="address" placeholder="Delivery address"><input id="city" placeholder="Delivery city"><select id="dtype"><option value="standard">Standard</option><option value="quick">Quick Delivery</option></select><button onclick="checkout()">Place order</button></aside><button id="cartBtn" onclick="toggleCart()">Cart <span id="count">0</span></button><div id="modal" class="hide"><div class="modal"><button onclick="closeAuth()">×</button><h2>Account</h2><div class="tabs"><button onclick="tab('signup')">Create account</button><button onclick="tab('signin')">Login</button><button onclick="tab('otp')">OTP</button></div><form id="signup"><input id="sn" placeholder="Full name" required><input id="se" type="email" placeholder="Email" required><input id="sp" type="password" placeholder="Password" required><select id="sr"><option value="customer">Customer</option><option value="shop_owner">Shop owner</option><option value="delivery">Delivery person</option></select><button>Create account</button></form><form id="signin" class="hide"><input id="le" type="email" placeholder="Email" required><input id="lp" type="password" placeholder="Password" required><button>Login</button></form><form id="otp" class="hide"><input id="oe" type="email" placeholder="Email" required><button type="button" onclick="sendOTP()">Send OTP</button><input id="oc" maxlength="6" placeholder="OTP"><button type="button" onclick="verifyOTP()">Verify</button></form><p id="msg"></p></div></div><script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js"></script></body></html>
