<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Owner</title><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><a href="index.html" class="top-link">← Home</a><div class="brand">🏪 Shop Owner</div><span></span></header>
<main class="form-page">
<section class="panel"><h2>Create Shop</h2>
<div class="form-group"><label>Shop name</label><input id="shopName"></div>
<div class="form-group"><label>Owner name</label><input id="shopOwner"></div>
<div class="form-group"><label>City</label><input id="shopCity" placeholder="Maiduguri"></div>
<div class="form-group"><label>App commission per item (₦)</label><input id="shopCommission" type="number" min="0"></div>
<button class="primary" id="createShopBtn">Create Shop</button><p id="shopMessage" class="msg"></p></section>
<section class="panel"><h2>Add Product</h2>
<div class="form-group"><label>Product name</label><input id="productName"></div>
<div class="row"><div class="form-group"><label>Price (₦)</label><input id="productPrice" type="number" min="1"></div><div class="form-group"><label>Stock</label><input id="availableQuantity" type="number" min="1" value="10"></div></div>
<div class="form-group"><label>Category</label><select id="productCategory"><option>Food</option><option>Drinks</option><option>Fashion</option><option>Electronics</option><option>Household</option><option>Other</option></select></div>
<div class="form-group"><label>Minimum quantity</label><input id="minimumQuantity" type="number" min="1" value="1"></div>
<button class="primary" id="addProductBtn">Add Product</button><p id="productMessage" class="msg"></p></section>
<section class="panel"><h2>My Shop</h2><div id="myShop">No shop created.</div><h3>My Products</h3><div id="myProducts"></div></section>
</main>
<nav class="bottom"><a href="index.html">🏠<span>Home</span></a><a href="index.html#productsSection">🛍️<span>Products</span></a><a class="active" href="shop.html">🏪<span>Shop</span></a><a href="cart.html">🛒<span>Cart</span></a><a href="profile.html">👤<span>Profile</span></a></nav>
<script src="shop.js"></script></body></html>
