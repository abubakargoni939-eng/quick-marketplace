<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Owner</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><main class="page"><a href="index.html">← Home</a><div class="panel"><h1>Shop Owner</h1><div id="msg"></div><form id="shopForm" class="form"><input id="shopName" placeholder="Shop name" required><input id="city" placeholder="City" required><input id="commission" type="number" min="0" placeholder="App commission per item (₦)" required><input id="minimumOrder" type="number" min="1" value="1" placeholder="Minimum order quantity"><button class="btn full">Create shop</button></form></div><div class="panel"><h2>Add Product</h2><form id="productForm" class="form"><input id="productName" placeholder="Product name" required><input id="price" type="number" min="1" placeholder="Selling price" required><input id="stock" type="number" min="1" value="10" placeholder="Stock quantity" required><input id="productMin" type="number" min="1" value="1" placeholder="Minimum quantity"><input id="category" placeholder="Category" required><button class="btn full">Add product</button></form></div></main><script src="common.js"></script><script src="shop.js"></script></body></html>
